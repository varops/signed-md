name: Release

# After CI passes on main: release the version in package.json, once.
#   1. Turn the changelog's Unreleased section into the version's section, commit it to main
#      and tag v<version>.
#   2. Publish the image for amd64 and arm64: <version>, <major>.<minor> and latest.
#   3. Create the GitHub Release with the changelog notes.
#   4. Publish the signed-md verifier to npm (when the NPM_TOKEN secret is set).
#   5. Merge main back into develop, so develop has the stamped changelog.
# A version that is already tagged is skipped, so pushes to main without a new version do nothing.
#
# Off until the repository variable RELEASES_ENABLED is "true" (Settings → Secrets and variables
# → Actions → Variables). Until the first release, work still happens directly on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: vars.RELEASES_ENABLED == 'true' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          node scripts/release.mjs check
          version="$(node scripts/release.mjs version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$version" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released: nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the changelog, commit and tag
        if: steps.v.outputs.new == 'true'
        run: |
          node scripts/release.mjs stamp > "$RUNNER_TEMP/notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${{ steps.v.outputs.version }}"
          git tag -a "v${{ steps.v.outputs.version }}" -m "v${{ steps.v.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.v.outputs.version }}"

      - uses: docker/setup-qemu-action@v3
        if: steps.v.outputs.new == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.new == 'true'
      - uses: docker/login-action@v3
        if: steps.v.outputs.new == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        if: steps.v.outputs.new == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.minor }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=Signed.md
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        if: steps.v.outputs.new == 'true'
        run: |
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "**Docker:** \`docker pull ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}\`"
          } > "$RUNNER_TEMP/release.md"
          gh release create "v${{ steps.v.outputs.version }}" --title "v${{ steps.v.outputs.version }}" --notes-file "$RUNNER_TEMP/release.md" --verify-tag

      - uses: pnpm/action-setup@v4
        if: steps.v.outputs.new == 'true' && env.NPM_TOKEN != ''
      - uses: actions/setup-node@v4
        if: steps.v.outputs.new == 'true' && env.NPM_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Publish the verifier to npm
        if: steps.v.outputs.new == 'true' && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          cd packages/verify
          pnpm run build
          # The bundle in dist/ holds everything it needs: publish it as a stand-alone CLI.
          npm pkg delete dependencies devDependencies scripts exports
          npm publish --access public

      - name: Merge main back into develop
        if: steps.v.outputs.new == 'true'
        run: |
          if ! git ls-remote --exit-code --heads origin develop >/dev/null; then
            echo "No develop branch yet: skipped."
            exit 0
          fi
          git fetch origin develop
          git checkout -B develop origin/develop
          if git merge --no-edit "v${{ steps.v.outputs.version }}"; then
            git push origin develop
          else
            git merge --abort
            echo "::warning::Merging v${{ steps.v.outputs.version }} into develop had conflicts. Merge main into develop by hand."
          fi
