name: Release candidate

# After CI passes on rc: publish a pre-release image for amd64 and arm64, tagged
# rc (always the latest candidate) and <version>-rc.<run>, e.g. 1.2.0-rc.14.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [rc]

permissions:
  contents: read
  packages: write

concurrency:
  group: rc
  cancel-in-progress: true

jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Version
        id: v
        run: |
          node scripts/release.mjs check
          echo "version=$(node scripts/release.mjs version)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:rc
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}-rc.${{ github.run_number }}
          labels: |
            org.opencontainers.image.title=Signed.md
            org.opencontainers.image.version=${{ steps.v.outputs.version }}-rc.${{ github.run_number }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
