name: CI

# Work lands on develop, release candidates on rc, releases on main. The rc and release
# workflows run after this one passes on their branch.
on:
  push:
    branches: [develop, rc, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: signed
          POSTGRES_PASSWORD: signed
          POSTGRES_DB: signed_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U signed" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://signed:signed@localhost:5432/signed_test
      PLAYWRIGHT_PATH: /tmp/pw/node_modules/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Typst
        run: |
          curl -fsSL https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C /tmp
          sudo mv /tmp/typst-*/typst /usr/local/bin/typst
      - name: Install Playwright (for the acceptance test)
        run: |
          npm install --prefix /tmp/pw playwright
          npx --prefix /tmp/pw playwright install --with-deps chromium
      - name: Versions agree and the changelog has an Unreleased section
        run: node scripts/release.mjs check
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Acceptance test on PostgreSQL
        run: E2E_DATABASE_URL=$TEST_POSTGRES_URL pnpm vitest run apps/server/test/acceptance

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t signed-md:ci .
      - name: Smoke test
        run: |
          docker run -d --name smd -p 3000:3000 signed-md:ci
          for i in $(seq 1 30); do curl -fsS localhost:3000/health && break; sleep 1; done
          curl -fsS localhost:3000/health >/dev/null || { docker logs smd; exit 1; }
          # The API and MCP load on their first request, from separate files of the bundle.
          curl -fsS -o /dev/null localhost:3000/openapi.json || { docker logs smd; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/mcp)" = 405 || { docker logs smd; exit 1; }
